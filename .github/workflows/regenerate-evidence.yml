name: Regenerate benchmark evidence

on:
  push:
    branches: [improve/topology-benchmark-evidence]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute notebook and regenerate evidence
        run: |
          python -m nbconvert --to notebook --execute main.ipynb --output executed_main.ipynb --ExecutePreprocessor.timeout=600
          python check_phase1_submission.py
      - name: Commit regenerated evidence on branch pushes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md report.md results/tables results/figures
          if git diff --cached --quiet; then
            echo "Generated evidence is already up to date."
          else
            git commit -m "Regenerate Phase 1 benchmark evidence"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-phase1-evidence
          path: |
            executed_main.ipynb
            README.md
            report.md
            results/tables/**
            results/figures/**
          if-no-files-found: error
          retention-days: 7
