name: Regenerate benchmark evidence

on:
  push:
    branches: [improve/topology-benchmark-evidence, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute notebook and regenerate evidence
        run: |
          python -m nbconvert --to notebook --execute main.ipynb --output executed_main.ipynb --ExecutePreprocessor.timeout=600
          python check_phase1_submission.py
      - name: Upload regenerated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-phase1-evidence
          path: |
            executed_main.ipynb
            README.md
            report.md
            results/tables/**
            results/figures/**
          if-no-files-found: warn
          retention-days: 7
