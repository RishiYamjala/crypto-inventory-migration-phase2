name: Project validation

on:
  push:
    branches: [main, "upgrade/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Validate participant-defined processor models
        run: python validate_processors.py

      - name: Evaluate scanner on public Requests repository
        run: python scripts/evaluate_public_repo.py --repo psf/requests --ref v2.34.2

      - name: Execute notebook from a clean environment
        run: |
          python -m nbconvert --to notebook --execute main.ipynb \
            --output executed_main.ipynb --ExecutePreprocessor.timeout=600

      - name: Check required Phase 1 artifacts
        run: python check_phase1_submission.py

      - name: Upload regenerated benchmark and scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-guide-v2-validation-evidence
          path: |
            executed_main.ipynb
            report.md
            results/tables/
            results/figures/
          if-no-files-found: warn
